name: Deploy Portfolio to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Agar aap Vue.js / React / Vite use kar rahe hain toh yeh build steps enable karein:
    # - name: Setup Node.js
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: '20'
    # - name: Install Dependencies & Build
    #   run: |
    #     npm install
    #     npm run build

    - name: Deploy to EC2 via SSH
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ec2-user
          if [ -d "portfolio-repo" ]; then
            cd portfolio-repo
            git fetch origin main
            git reset --hard origin/main
          else
            git clone https://github.com/moazali06/YOUR_REPO_NAME.git portfolio-repo
            cd portfolio-repo
          fi
          
          # Nginx directory ki permissions fix kar ke files copy karein
          sudo mkdir -p /usr/share/nginx/html
          sudo rm -rf /usr/share/nginx/html/*
          sudo cp -r * /usr/share/nginx/html/
          sudo systemctl restart nginx